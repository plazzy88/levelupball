<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Head Ball Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background: #090c10;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 450px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Компактное верхнее табло */
        .top-hud {
            position: absolute;
            top: 8px;
            left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 20;
            pointer-events: none;
        }
        .scoreboard-compact {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #f1c40f;
            border-radius: 20px;
            padding: 4px 16px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .timer-badge { color: #f39c12; font-size: 14px; }
        .coins-badge {
            background: rgba(0,0,0,0.6);
            border: 1px solid #f1c40f;
            border-radius: 15px;
            padding: 4px 10px;
            font-size: 13px;
            color: #f1c40f;
            font-weight: bold;
            pointer-events: auto;
        }
        .btn-shop-open {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Кнопки суперспособностей */
        .powers-ui {
            position: absolute;
            top: 50px;
            left: 15px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .btn-power {
            width: 42px;
            height: 42px;
            background: rgba(0, 168, 255, 0.4);
            border: 2px solid #00a8ff;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }
        .btn-power:active { transform: scale(0.92); }
        .btn-power.used {
            opacity: 0.3;
            filter: grayscale(1);
            pointer-events: none;
            border-color: #888;
        }
        #btn-bigball { background: rgba(255, 127, 80, 0.4); border-color: #ff7f50; }

        /* Кнопки управления */
        .ui-controls {
            position: absolute;
            bottom: 12px;
            left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10;
            pointer-events: none;
        }
        .btn-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.45); }
        .btn-kick { background: rgba(255, 71, 87, 0.5); border-color: #ff4757; }

        /* Модальные окна */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 10, 20, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            backdrop-filter: blur(8px);
            padding: 20px;
        }
        .modal-overlay h1 { font-size: 38px; margin-bottom: 10px; }
        .modal-overlay p { font-size: 22px; margin-bottom: 20px; color: #e2e8f0; }
        .btn-main {
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #2ed573, #26af5f);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
        }

        /* Магазин Бутс */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }
        .shop-item {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .shop-item.active { border-color: #2ed573; background: rgba(46, 213, 115, 0.15); }
        .shop-item-title { font-weight: bold; font-size: 14px; }
        .shop-item-preview { font-size: 28px; }
        .btn-buy {
            background: #f1c40f;
            border: none;
            color: #000;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-equip {
            background: #2ed573;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="top-hud">
        <div class="coins-badge">🪙 <span id="user-coins">0</span></div>
        <div class="scoreboard-compact">
            <span id="score-p1" style="color: #2ed573;">0</span>
            <span>:</span>
            <span id="score-p2" style="color: #ff4757;">0</span>
            <span class="timer-badge" id="match-timer">⏱️ 60</span>
        </div>
        <button class="btn-shop-open" onclick="openShop()">🛒 Магазин</button>
    </div>

    <div class="powers-ui">
        <div class="btn-power" id="btn-freeze" onclick="useFreeze()">❄️</div>
        <div class="btn-power" id="btn-bigball" onclick="useBigBall()">🔥</div>
    </div>

    <div class="ui-controls">
        <div class="btn-group">
            <div class="btn" id="btn-left">◄</div>
            <div class="btn" id="btn-right">►</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-jump">▲</div>
            <div class="btn btn-kick">⚽</div>
        </div>
    </div>

    <!-- Модалка окончания игры -->
    <div class="modal-overlay" id="game-over-modal">
        <h1 id="result-title">ПОБЕДА!</h1>
        <p id="result-score">Счет: 3 - 1</p>
        <button class="btn-main" onclick="restartMatch()">СЫГРАТЬ СНОВА</button>
    </div>

    <!-- Модалка Магазина -->
    <div class="modal-overlay" id="shop-modal">
        <h1>🛒 Магазин Бутс</h1>
        <p>Выбирай стиль для своего игрока</p>
        <div class="shop-grid" id="shop-items-container"></div>
        <button class="btn-main" style="background: #74b9ff;" onclick="closeShop()">ЗАКРЫТЬ</button>
    </div>
</div>

<script>
// --- TELEGRAM WEBAPP СЧИТЫВАНИЕ ---
const tg = window.Telegram?.WebApp;
let telegramUser = { id: 0, first_name: 'Игрок 1' };
if (tg) {
    tg.ready();
    tg.expand();
    if (tg.initDataUnsafe?.user) telegramUser = tg.initDataUnsafe.user;
}

// --- ЧТЕНИЕ И СИНХРОНИЗАЦИЯ МОНЕТ ИЗ БД БОТА ---
let coinsFromUrl = null;
try {
    const urlParams = new URLSearchParams(window.location.search);
    const p = urlParams.get('coins');
    if (p !== null && !isNaN(parseInt(p))) {
        coinsFromUrl = parseInt(p);
    }
} catch (e) {}

let userCoins = 100;
if (coinsFromUrl !== null) {
    userCoins = coinsFromUrl;
} else {
    try {
        userCoins = parseInt(localStorage.getItem('headball_coins') || '100');
    } catch(e) {}
}

let unlockedBoots = ['boot_default'];
try {
    unlockedBoots = JSON.parse(localStorage.getItem('headball_boots') || '["boot_default"]');
} catch(e) {}

let currentBoot = 'boot_default';
try {
    currentBoot = localStorage.getItem('headball_active_boot') || 'boot_default';
} catch(e) {}

const bootsCatalog = [
    { id: 'boot_default', name: 'Базовые', price: 0, color: 0xf1c40f, icon: '👟' },
    { id: 'boot_gold', name: 'Золото 👑', price: 150, color: 0xffd700, icon: '🌟' },
    { id: 'boot_fire', name: 'Огонь 🔥', price: 300, color: 0xff4757, icon: '🔥' },
    { id: 'boot_cyber', name: 'Кибер ⚡', price: 500, color: 0x00d2d3, icon: '⚡' }
];

function updateCoinsDisplay() {
    const el = document.getElementById('user-coins');
    if (el) el.innerText = userCoins;
    try { localStorage.setItem('headball_coins', userCoins); } catch(e) {}
}
updateCoinsDisplay();

// --- ЗВУКОВОЙ СИНТЕЗАТОР ---
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
const soundFx = {
    kick: () => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(160, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    },
    whistle: () => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(2300, audioCtx.currentTime);
        osc.frequency.setValueAtTime(2550, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    },
    goal: () => {
        if (!audioCtx) return;
        [261, 329, 392, 523].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + idx * 0.08); osc.stop(audioCtx.currentTime + idx * 0.08 + 0.25);
        });
    }
};

// --- СЕНСОРНОЕ УПРАВЛЕНИЕ ---
const inputState = { left: false, right: false, jump: false, kick: false, down: false };
function bindButton(id, stateKey) {
    const el = document.getElementById(id);
    if (!el) return;
    const start = (e) => { e.preventDefault(); initAudio(); inputState[stateKey] = true; };
    const end = (e) => { e.preventDefault(); inputState[stateKey] = false; };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
}
bindButton('btn-left', 'left');
bindButton('btn-right', 'right');
bindButton('btn-jump', 'jump');
const btnKickEl = document.querySelector('.btn-kick');
if (btnKickEl) {
    btnKickEl.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); inputState.kick = true; });
    btnKickEl.addEventListener('mousedown', () => { initAudio(); inputState.kick = true; });
}

// --- ИГРОВОЙ ДВИЖОК PHASER 3 ---
const catDefault = 0x0001, catPlayer = 0x0002, catBall = 0x0004, catGoal = 0x0008;
const GOAL_CROSSBAR_Y = 260;

const config = {
    type: Phaser.AUTO,
    width: 800, height: 450,
    parent: 'game-container',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'matter', matter: { gravity: { y: 0.85 }, debug: false } },
    scene: { preload: preload, create: create, update: update }
};

let player, aiPlayer, ball;
let playerVisual, aiVisual, playerBoot, aiBoot, iceOverlay;
let playerPupils = [], aiPupils = [];
let centerAnnounceText;
let cursors, spaceKey, currentScene;
let score = { left: 0, right: 0 };
let matchTime = 60, timerEvent;
let gameState = 'countdown';
let powersUsed = { freeze: false, bigBall: false }, isAiFrozen = false, isBallBig = false;

function preload() {
    generateProceduralTextures(this);
}

function generateProceduralTextures(scene) {
    // Текстура мяча
    const ballCanvas = scene.textures.createCanvas('ballTex', 44, 44);
    const ctxB = ballCanvas.context;
    ctxB.beginPath(); ctxB.arc(22, 22, 20, 0, Math.PI * 2);
    ctxB.fillStyle = '#ffffff'; ctxB.fill();
    ctxB.lineWidth = 2; ctxB.strokeStyle = '#1e293b'; ctxB.stroke();
    ctxB.fillStyle = '#1e293b';
    ctxB.beginPath();
    for (let i = 0; i < 5; i++) {
        let a = (i * 72 - 18) * Math.PI / 180;
        let x = 22 + 7 * Math.cos(a), y = 22 + 7 * Math.sin(a);
        if (i === 0) ctxB.moveTo(x, y); else ctxB.lineTo(x, y);
    }
    ctxB.closePath(); ctxB.fill();
    ballCanvas.refresh();

    // Генерация видов бутс
    bootsCatalog.forEach(b => {
        const bCanvas = scene.textures.createCanvas(b.id, 36, 20);
        const ctxBt = bCanvas.context;
        ctxBt.fillStyle = '#' + b.color.toString(16).padStart(6, '0');
        ctxBt.beginPath();
        ctxBt.rect(4, 4, 28, 12);
        ctxBt.fill();
        ctxBt.fillStyle = '#ffffff';
        ctxBt.fillRect(2, 14, 30, 4);
        bCanvas.refresh();
    });
}

function create() {
    currentScene = this;
    const world = this.matter.world;
    world.setBounds(0, 0, 800, 450, 32, true, true, true, true);

    this.input.keyboard.addCapture([
        Phaser.Input.Keyboard.KeyCodes.UP, Phaser.Input.Keyboard.KeyCodes.DOWN,
        Phaser.Input.Keyboard.KeyCodes.LEFT, Phaser.Input.Keyboard.KeyCodes.RIGHT, Phaser.Input.Keyboard.KeyCodes.SPACE
    ]);
    cursors = this.input.keyboard.createCursorKeys();
    spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    // --- ОТРИСОВКА СТАДИОНА И ТРИБУН ---
    const bgGfx = this.add.graphics();
    bgGfx.fillGradientStyle(0x0f172a, 0x0f172a, 0x1e293b, 0x1e293b, 1);
    bgGfx.fillRect(0, 0, 800, 260);

    // Трибуны с фанатами
    for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 800; col += 12) {
            let colHex = [0xff4757, 0x2ed573, 0x1e90ff, 0xf1c40f, 0xffffffff][Math.floor(Math.random() * 5)];
            bgGfx.fillStyle(colHex, 0.7);
            bgGfx.fillRect(col, 100 + row * 16, 8, 8);
        }
    }

    // Поле
    for (let i = 0; i < 800; i += 80) {
        let col = (i / 80) % 2 === 0 ? 0x2ed573 : 0x26af5f;
        this.add.rectangle(i + 40, 355, 80, 190, col);
    }

    // Разметка поля
    const fieldLines = this.add.graphics();
    fieldLines.lineStyle(3, 0xffffff, 0.5);
    fieldLines.lineBetween(400, 260, 400, 430);
    fieldLines.strokeCircle(400, 340, 55);

    // Земля
    const groundGfx = this.add.rectangle(400, 435, 800, 30, 0x1e293b, 0);
    const ground = this.matter.add.gameObject(groundGfx, { isStatic: true, label: 'ground' });
    ground.setCollisionCategory(catDefault);

    // Ворота
    build2DGoal(this, true);
    build2DGoal(this, false);

    // Игрок
    const playerGfx = this.add.circle(0, 0, 35, 0x2ed573);
    player = this.matter.add.gameObject(playerGfx, { shape: { type: 'circle', radius: 35 }, restitution: 0.2, friction: 0.1, label: 'player' });
    player.setFixedRotation();
    player.setCollisionCategory(catPlayer);

    playerVisual = this.add.container(200, 300);
    const pHead = this.add.circle(0, -10, 35, 0x2ed573); pHead.setStrokeStyle(3, 0xffffff);
    const pBody = this.add.ellipse(0, 20, 30, 20, 0x1e90ff);
    const pEyeL = this.add.circle(12, -18, 8, 0xffffff);
    const pPupilL = this.add.circle(14, -18, 3, 0x000000);
    playerVisual.add([pBody, pHead, pEyeL, pPupilL]);
    playerPupils.push(pPupilL);

    playerBoot = this.add.image(215, 330, currentBoot).setOrigin(0.2, 0.5);

    // Бот ИИ
    const aiGfx = this.add.circle(0, 0, 35, 0xff4757);
    aiPlayer = this.matter.add.gameObject(aiGfx, { shape: { type: 'circle', radius: 35 }, restitution: 0.2, friction: 0.1, label: 'aiPlayer' });
    aiPlayer.setFixedRotation();
    aiPlayer.setCollisionCategory(catPlayer);

    aiVisual = this.add.container(600, 300);
    const aiHead = this.add.circle(0, -10, 35, 0xff4757); aiHead.setStrokeStyle(3, 0xffffff);
    const aiBody = this.add.ellipse(0, 20, 30, 20, 0xd63031);
    const aiEyeL = this.add.circle(-12, -18, 8, 0xffffff);
    const aiPupilL = this.add.circle(-14, -18, 3, 0x000000);
    iceOverlay = this.add.circle(0, -10, 42, 0x74b9ff, 0.65).setStrokeStyle(4, 0x0984e3).setVisible(false);
    aiVisual.add([aiBody, aiHead, aiEyeL, aiPupilL, iceOverlay]);
    aiPupils.push(aiPupilL);

    aiBoot = this.add.image(585, 330, 'boot_default').setOrigin(0.8, 0.5);
    aiBoot.setFlipX(true);

    // Мяч
    ball = this.matter.add.image(400, 150, 'ballTex', null, {
        shape: { type: 'circle', radius: 22 },
        restitution: 0.82, frictionAir: 0.005, density: 0.003, label: 'ball'
    });
    ball.setCollisionCategory(catBall);
    ball.setCollidesWith([catDefault, catPlayer, catGoal]);

    centerAnnounceText = this.add.text(400, 200, '', { fontSize: '54px', color: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

    // Точная регистрация голов
    world.on('collisionstart', (event) => {
        event.pairs.forEach(pair => {
            const labels = [pair.bodyA.label, pair.bodyB.label];
            if (gameState === 'playing') {
                if (labels.includes('ball') && labels.includes('rightGoal') && ball.x > 740) {
                    score.left++;
                    soundFx.goal();
                    onGoalScored();
                } else if (labels.includes('ball') && labels.includes('leftGoal') && ball.x < 60) {
                    score.right++;
                    soundFx.goal();
                    onGoalScored();
                }
            }
        });
    });

    resetAllPositions();
    startMatchCountdown();
}

function build2DGoal(scene, isLeft) {
    const goalWidth = 80, crossbarY = GOAL_CROSSBAR_Y, color = isLeft ? 0x3742fa : 0xff4757;
    const gfx = scene.add.graphics();
    const startX = isLeft ? 0 : 800 - goalWidth, endX = isLeft ? goalWidth : 800, tipX = isLeft ? goalWidth : 800 - goalWidth;

    // Сетка
    gfx.lineStyle(1, 0xffffff, 0.25);
    for (let x = startX; x <= endX; x += 10) gfx.lineBetween(x, crossbarY, x, 420);
    for (let y = crossbarY; y <= 420; y += 12) gfx.lineBetween(startX, y, endX, y);

    // Каркас
    gfx.lineStyle(5, color, 1); gfx.strokeRect(startX, crossbarY, goalWidth, 420 - crossbarY);
    gfx.lineStyle(6, 0xffffff, 1); gfx.lineBetween(startX, crossbarY, tipX, crossbarY); gfx.lineBetween(tipX, crossbarY, tipX, 420);

    // Круглая штанга (перекладина) на переднем крае ворот
    const postTip = scene.matter.add.circle(tipX, crossbarY, 8, { 
        isStatic: true, 
        label: 'crossbar', 
        friction: 0.0, 
        restitution: 0.9 
    });
    postTip.collisionFilter = { category: catGoal, mask: catBall | catPlayer };

    // Верхняя крыша сетки ворот (узость со скольжением)
    const barCenterX = isLeft ? (goalWidth / 2) - 4 : 800 - (goalWidth / 2) + 4;
    const mainBar = scene.matter.add.rectangle(barCenterX, crossbarY, goalWidth - 8, 6, { 
        isStatic: true, 
        label: 'crossbar', 
        friction: 0.0, 
        restitution: 0.85 
    });
    mainBar.collisionFilter = { category: catGoal, mask: catBall | catPlayer };

    // Сенсор ГОЛА — глубоко внутри сетки
    const sensorCenterX = isLeft ? 25 : 775;
    const goalSensor = scene.add.rectangle(sensorCenterX, crossbarY + 70, 30, 130);
    const sensorBody = scene.matter.add.gameObject(goalSensor, { isStatic: true, isSensor: true, label: isLeft ? 'leftGoal' : 'rightGoal' });
    sensorBody.setCollisionCategory(catGoal);
    sensorBody.setCollidesWith([catBall]);
}

function resetAllPositions() {
    const p1El = document.getElementById('score-p1');
    const p2El = document.getElementById('score-p2');
    if (p1El) p1El.innerText = score.left;
    if (p2El) p2El.innerText = score.right;

    player.setPosition(200, 350);
    player.setVelocity(0, 0);

    aiPlayer.setPosition(600, 350);
    aiPlayer.setVelocity(0, 0);

    ball.setPosition(400, 120);
    ball.setVelocity(0, 0);
}

function onGoalScored() {
    gameState = 'goal_pause';
    centerAnnounceText.setText('ГОЛ!');
    currentScene.time.delayedCall(1200, () => {
        centerAnnounceText.setText('');
        resetAllPositions();
        gameState = 'playing';
    });
}

function startMatchCountdown() {
    gameState = 'countdown';
    let count = 3;
    centerAnnounceText.setText(count);
    currentScene.time.addEvent({
        delay: 1000, repeat: 3,
        callback: () => {
            count--;
            if (count > 0) centerAnnounceText.setText(count);
            else if (count === 0) { centerAnnounceText.setText('ПОЕХАЛИ!'); soundFx.whistle(); }
            else { centerAnnounceText.setText(''); gameState = 'playing'; startMatchTimer(); }
        }
    });
}

function startMatchTimer() {
    if (timerEvent) timerEvent.destroy();
    timerEvent = currentScene.time.addEvent({
        delay: 1000, repeat: matchTime - 1,
        callback: () => {
            matchTime--;
            const timerEl = document.getElementById('match-timer');
            if (timerEl) timerEl.innerText = `⏱️ ${matchTime}`;
            if (matchTime <= 0) endMatch();
        }
    });
}

function endMatch() {
    gameState = 'gameover';
    ball.setVelocity(0, 0);
    soundFx.whistle();

    let resultStatus = 'draw', reward = 50;
    if (score.left > score.right) { resultStatus = 'win'; reward = 100; }
    else if (score.left < score.right) { resultStatus = 'lose'; reward = 20; }

    userCoins += reward;
    updateCoinsDisplay();

    const titleEl = document.getElementById('result-title');
    const scoreEl = document.getElementById('result-score');
    const modalEl = document.getElementById('game-over-modal');

    if (titleEl) titleEl.innerText = resultStatus === 'win' ? 'ПОБЕДА!' : (resultStatus === 'lose' ? 'ПОРАЖЕНИЕ' : 'НИЧЬЯ');
    if (scoreEl) scoreEl.innerText = `Счет: ${score.left} - ${score.right} (+${reward} 🪙)`;
    if (modalEl) modalEl.style.display = 'flex';

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({
            user_id: telegramUser.id,
            player_score: score.left,
            ai_score: score.right,
            result: resultStatus,
            coins: userCoins
        }));
    }
}

window.restartMatch = function() {
    const modalEl = document.getElementById('game-over-modal');
    if (modalEl) modalEl.style.display = 'none';
    score = { left: 0, right: 0 }; matchTime = 60;
    const timerEl = document.getElementById('match-timer');
    if (timerEl) timerEl.innerText = '⏱️ 60';
    powersUsed = { freeze: false, bigBall: false };
    const btnFreeze = document.getElementById('btn-freeze');
    const btnBigball = document.getElementById('btn-bigball');
    if (btnFreeze) btnFreeze.classList.remove('used');
    if (btnBigball) btnBigball.classList.remove('used');
    isAiFrozen = false; iceOverlay.setVisible(false);
    resetAllPositions();
    startMatchCountdown();
};

window.useFreeze = function() {
    initAudio();
    if (powersUsed.freeze || gameState !== 'playing') return;
    powersUsed.freeze = true;
    const btnFreeze = document.getElementById('btn-freeze');
    if (btnFreeze) btnFreeze.classList.add('used');
    isAiFrozen = true; iceOverlay.setVisible(true);
    currentScene.time.delayedCall(3500, () => { isAiFrozen = false; iceOverlay.setVisible(false); });
};

window.useBigBall = function() {
    initAudio();
    if (powersUsed.bigBall || gameState !== 'playing') return;
    powersUsed.bigBall = true;
    const btnBigball = document.getElementById('btn-bigball');
    if (btnBigball) btnBigball.classList.add('used');
    isBallBig = true; ball.setScale(2.0); currentScene.matter.body.scale(ball.body, 2.0, 2.0);
    currentScene.time.delayedCall(5000, () => {
        if (ball && ball.body) { ball.setScale(1.0); currentScene.matter.body.scale(ball.body, 0.5, 0.5); }
        isBallBig = false;
    });
};

function update() {
    playerVisual.setPosition(player.x, player.y);
    playerBoot.setPosition(player.x + 15, player.y + 25);
    aiVisual.setPosition(aiPlayer.x, aiPlayer.y);
    aiBoot.setPosition(aiPlayer.x - 15, aiPlayer.y + 25);

    // Взгляд за мячом
    const angleP = Phaser.Math.Angle.Between(player.x, player.y, ball.x, ball.y);
    playerPupils.forEach(p => { p.x = 12 + Math.cos(angleP) * 3; p.y = -18 + Math.sin(angleP) * 3; });
    const angleAI = Phaser.Math.Angle.Between(aiPlayer.x, aiPlayer.y, ball.x, ball.y);
    aiPupils.forEach(p => { p.x = -12 + Math.cos(angleAI) * 3; p.y = -18 + Math.sin(angleAI) * 3; });

    // 1. НАДЕЖНЫЙ СБРОС С ВОРОТ (НИКТО НЕ МОЖЕТ СТОЯТЬ ИЛИ ЗАСТРЯТЬ НА ПЕРЕКЛАДИНЕ)
    [player, aiPlayer, ball].forEach(obj => {
        if (!obj || !obj.body) return;
        
        // Левые ворота (x < 95, y < 275)
        if (obj.x < 95 && obj.y < GOAL_CROSSBAR_Y + 15) {
            obj.setVelocityX(7.5);
            if (obj.y < GOAL_CROSSBAR_Y) {
                obj.setVelocityY(-2.0);
            }
        }
        
        // Правые ворота (x > 705, y < 275)
        if (obj.x > 705 && obj.y < GOAL_CROSSBAR_Y + 15) {
            obj.setVelocityX(-7.5);
            if (obj.y < GOAL_CROSSBAR_Y) {
                obj.setVelocityY(-2.0);
            }
        }
    });

    if (gameState !== 'playing') return;

    const speed = 5.0;
    const moveLeft = cursors.left.isDown || inputState.left;
    const moveRight = cursors.right.isDown || inputState.right;
    const moveUp = cursors.up.isDown || inputState.jump;
    const moveDown = cursors.down.isDown || inputState.down;
    const isKicking = Phaser.Input.Keyboard.JustDown(spaceKey) || inputState.kick;

    if (moveLeft) player.setVelocityX(-speed);
    else if (moveRight) player.setVelocityX(speed);

    if (moveUp && player.y > 360) { player.setVelocityY(-10.5); inputState.jump = false; }

    // 2. СИСТЕМА РАЗНЫХ УДАРОВ (ВЕРХОМ / НИЗОМ / С ХОДУ)
    if (isKicking) {
        currentScene.tweens.add({ targets: playerBoot, angle: -55, duration: 85, yoyo: true });
        const distToBall = Phaser.Math.Distance.Between(player.x, player.y, ball.x, ball.y);
        
        if (distToBall < 125) {
            let vx = 15.0;
            let vy = -5.0;

            if (moveUp) {
                // Навес верхом
                vx = 11.0;
                vy = -11.5;
            } else if (moveDown) {
                // Низовой прострел
                vx = 19.5;
                vy = -1.8;
            } else if (player.body.velocity.x > 1) {
                // Удар с ходу
                vx = 18.0;
                vy = -6.0;
            }

            ball.setVelocity(vx, vy);
            soundFx.kick();
        }
        inputState.kick = false;
    }

    if (!isAiFrozen) updateAIBot();
    else aiPlayer.setVelocity(0, 0);
}

function updateAIBot() {
    const aiSpeed = 2.7, homeX = 650;
    if (ball.x > 450) {
        if (ball.x < aiPlayer.x - 20) aiPlayer.setVelocityX(-aiSpeed);
        else if (ball.x > aiPlayer.x + 20) aiPlayer.setVelocityX(aiSpeed);
    } else {
        if (aiPlayer.x < homeX - 10) aiPlayer.setVelocityX(aiSpeed);
        else if (aiPlayer.x > homeX + 10) aiPlayer.setVelocityX(-aiSpeed);
    }

    const distToBall = Phaser.Math.Distance.Between(aiPlayer.x, aiPlayer.y, ball.x, ball.y);
    if (distToBall < 95 && ball.y < aiPlayer.y && aiPlayer.y > 360 && Math.random() < 0.25) aiPlayer.setVelocityY(-10.0);

    // Вариативный удар ИИ
    if (distToBall < 85 && Math.random() < 0.04) {
        currentScene.tweens.add({ targets: aiBoot, angle: 55, duration: 85, yoyo: true });
        
        let aiVx = -13.0, aiVy = -5.0;
        const randType = Math.random();
        if (randType < 0.35) { aiVx = -10.0; aiVy = -11.0; }
        else if (randType < 0.70) { aiVx = -17.0; aiVy = -2.0; }
        
        ball.setVelocity(aiVx, aiVy);
        soundFx.kick();
    }
}

// --- ЛОГИКА МАГАЗИНА ---
function openShop() {
    renderShopItems();
    const modalEl = document.getElementById('shop-modal');
    if (modalEl) modalEl.style.display = 'flex';
}
function closeShop() {
    const modalEl = document.getElementById('shop-modal');
    if (modalEl) modalEl.style.display = 'none';
}

function renderShopItems() {
    const container = document.getElementById('shop-items-container');
    if (!container) return;
    container.innerHTML = '';

    bootsCatalog.forEach(b => {
        const isUnlocked = unlockedBoots.includes(b.id);
        const isActive = currentBoot === b.id;

        const itemEl = document.createElement('div');
        itemEl.className = `shop-item ${isActive ? 'active' : ''}`;
        
        let actionBtn = '';
        if (isActive) {
            actionBtn = '<span style="color:#2ed573; font-size:12px; font-weight:bold;">Надето</span>';
        } else if (isUnlocked) {
            actionBtn = `<button class="btn-equip" onclick="equipBoot('${b.id}')">Надеть</button>`;
        } else {
            actionBtn = `<button class="btn-buy" onclick="buyBoot('${b.id}', ${b.price})">${b.price} 🪙</button>`;
        }

        itemEl.innerHTML = `
            <div class="shop-item-preview">${b.icon}</div>
            <div class="shop-item-title">${b.name}</div>
            ${actionBtn}
        `;
        container.appendChild(itemEl);
    });
}

window.buyBoot = function(bootId, price) {
    if (userCoins >= price) {
        userCoins -= price;
        unlockedBoots.push(bootId);
        try { localStorage.setItem('headball_boots', JSON.stringify(unlockedBoots)); } catch(e){}
        updateCoinsDisplay();
        equipBoot(bootId);
    } else {
        alert('Не хватает монет!');
    }
};

window.equipBoot = function(bootId) {
    currentBoot = bootId;
    try { localStorage.setItem('headball_active_boot', bootId); } catch(e){}
    if (playerBoot) playerBoot.setTexture(bootId);
    renderShopItems();
};

const game = new Phaser.Game(config);
</script>
